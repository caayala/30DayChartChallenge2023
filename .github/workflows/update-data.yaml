name: update-data
on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC todos los d\xC3\xADas
  workflow_dispatch:
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Instala R
        uses: r-lib/actions/setup-r@v2

      - name: Cache paquetes renv
        uses: actions/cache@v4
        with:
          path: ~/.cache/R/renv
          key: ${{ runner.os }}-renv-${{ hashFiles('renv.lock') }}
          restore-keys: |
            ${{ runner.os }}-renv-

      - name: Restaurar entorno renv
        run: |
          R -q -e 'install.packages("renv", repos="https://cloud.r-project.org")'
          R -q -e 'renv::restore(prompt = FALSE)'

      - name: Ejecutar descarga y limpieza
        env:
          URL_CSV: ${{ secrets.URL_CSV }}
        run: Rscript R/download_process.R

      - name: Copiar CSV limpio a docs/
        run: |
          cp data/processed/clean.csv docs/clean.csv

      - name: Exportar Shiny a static (shinylive)
        run: |
          R -q -e 'if (!requireNamespace("shinylive", quietly = TRUE)) install.packages("shinylive"); shinylive::export("R/app.R", "docs")'

      - name: Commit & push si hay cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/clean.csv docs/
          git diff --cached --quiet || git commit -m "Daily data refresh"
          git push
